name: SkillSpector
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned SkillSpector
        run: python -m pip install -r requirements-scan.txt
      - name: Test security gate
        run: python -m unittest discover -s tests -v
      - name: Scan every skill and require complete SAFE reports
        run: python scripts/scan_skills.py
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillspector-reports
          path: reports/
          if-no-files-found: warn
